<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> login & signup pages</title>
    <!-- external resources -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* === EXTERNAL CSS (styles.css) === */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(145deg, #f0f5ff 0%, #e6edfa 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #121826;
        }
        :root { 
            --primary: #2a3ff2; 
            --primary-light: #dce3ff; 
            --secondary: #10b981; 
            --accent: #8b5cf6; 
            --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            --gradient-2: linear-gradient(145deg, #ff7e5f, #feb47b); 
            --gradient-3: linear-gradient(145deg, #56ccf2, #2f80ed); 
            --card-white: rgba(255,255,255,0.9); 
            --backdrop-blur: blur(16px); 
            --shadow-color: rgba(0,30,80,0.15); 
        }
        .auth-container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }
        /* glassmorphic card */
        .auth-card {
            background: var(--card-white);
            backdrop-filter: var(--backdrop-blur);
            border-radius: 56px;
            padding: 48px 40px;
            box-shadow: 0 35px 60px -25px var(--primary);
            border: 1px solid rgba(255,255,255,0.7);
            transition: transform 0.3s ease;
        }
        .auth-card:hover {
            transform: scale(1.01);
        }
        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 32px;
        }
        .logo-icon {
            background: var(--gradient-1);
            color: white;
            width: 70px;
            height: 70px;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 15px 25px -10px var(--primary);
            margin-bottom: 16px;
        }
        .logo-text {
            font-weight: 700;
            font-size: 2.2rem;
            font-family: 'Space Grotesk', sans-serif;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .auth-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            background: #f1f5f9;
            padding: 8px;
            border-radius: 80px;
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 14px 10px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: #1e293b;
            border: none;
            background: transparent;
        }
        .auth-tab.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 8px 18px -8px var(--shadow-color);
        }
        .auth-tab.inactive:hover {
            background: rgba(255,255,255,0.5);
        }
        /* form panels */
        .auth-panel {
            display: block;
        }
        .auth-panel.hidden {
            display: none;
        }
        .input-group {
            margin-bottom: 22px;
        }
        .input-group label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #334155;
            display: block;
            margin-bottom: 6px;
            margin-left: 8px;
        }
        .input-field {
            width: 100%;
            padding: 16px 24px;
            border-radius: 60px;
            border: 1px solid #d9e2ef;
            font-size: 1rem;
            background: rgba(255,255,255,0.7);
            transition: 0.2s;
        }
        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }
        .role-selector {
            display: flex;
            gap: 14px;
            margin: 20px 0 10px;
        }
        .role-option {
            flex: 1;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 50px;
            padding: 14px 8px;
            text-align: center;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .role-option input[type="radio"] {
            display: none;
        }
        .role-option:has(input:checked) {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
            font-weight: 600;
        }
        .btn-block {
            width: 100%;
            padding: 16px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 16px;
        }
        .btn-primary {
            background: var(--gradient-1);
            color: white;
            box-shadow: 0 15px 25px -12px var(--primary);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 22px 30px -12px var(--primary);
        }
        .footer-links {
            text-align: center;
            margin-top: 28px;
            font-size: 0.95rem;
            color: #475569;
        }
        .footer-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .small-note {
            font-size: 0.8rem;
            color: #64748b;
            text-align: center;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .university-badge {
            background: #e2e8f0;
            border-radius: 40px;
            padding: 10px 24px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        /* back to home link */
        .back-home {
            position: absolute;
            top: 30px;
            left: 30px;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(8px);
            padding: 12px 24px;
            border-radius: 60px;
            text-decoration: none;
            color: #1e293b;
            font-weight: 500;
            border: 1px solid white;
            transition: 0.2s;
        }
        .back-home:hover {
            background: white;
        }
        @media (max-width: 500px) {
            .auth-card { padding: 32px 20px; }
            .role-selector { flex-direction: column; }
        }
    </style>
</head>
<body>
    <!-- simple back to home (for context) -->
    <a href="Find.html" class="back-home"   ><i class="fas fa-arrow-left"></i> Back to CampusWheel</a>

    <div class="auth-container">
        <!-- main auth card: contains both login & signup panels as separate pages (visually) but we toggle via JS to simulate two pages in one – exactly like login page + signup page combined with navigation -->
        <div class="auth-card">
            <div class="logo-area">
                <div class="logo-icon"><i class="fas fa-motorcycle"></i></div>
                <span class="logo-text">CampusWheel</span>
                <div class="university-badge" style="margin-top: 12px;">
                    <i class="fas fa-id-card"></i> Shobhit University
                </div>
            </div>

            <!-- Tab switcher between Login and Signup pages -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="loginTabBtn">Log In</button>
                <button class="auth-tab inactive" id="signupTabBtn">Sign Up</button>
            </div>

            <!-- LOGIN PAGE (panel) -->
            <div class="auth-panel" id="loginPanel">
                <form onsubmit="event.preventDefault(); alert('Login demo — welcome!');">
                    <div class="input-group">
                        <label><i class="fas fa-envelope"></i> University email</label>
                        <input type="email" class="input-field" placeholder="student@shobhituniversity.ac.in" value="john.cse@shobhit.edu" required>
                    </div>
                    <div class="input-group">
                        <label><i class="fas fa-lock"></i> Password</label>
                        <input type="password" class="input-field" placeholder="••••••••" value="password123" required>
                    </div>
                    
                    <!-- choose role: bike owner or rider (login context) -->
                    <div class="role-selector">
                        <label class="role-option">
                            <input type="radio" name="loginRole" value="owner" checked> <i class="fas fa-bicycle"></i> Bike owner
                        </label>
                        <label class="role-option">
                            <input type="radio" name="loginRole" value="rider"> <i class="fas fa-user-graduate"></i> Rider
                        </label>
                    </div>

                    <button type="submit" class="btn-block btn-primary"><i class="fas fa-sign-in-alt"></i> Log in to dashboard</button>

                    <div class="footer-links">
                        <a href="#" id="forgotPasswordLink">Forgot password?</a> · 
                        <a href="#" id="switchToSignupFromLogin">Create account</a>
                    </div>
                    <div class="small-note">
                        <i class="fas fa-shield-alt"></i> Verified by university ID · demo credentials
                    </div>
                </form>
            </div>

            <!-- SIGNUP PAGE (panel) initially hidden -->
            <div class="auth-panel hidden" id="signupPanel">
                <form onsubmit="event.preventDefault(); alert('Signup demo — account created!');">
                    <div class="input-group">
                        <label><i class="fas fa-user"></i> Full name</label>
                        <input type="text" class="input-field" placeholder="e.g. Priya Sharma" value="Priya Sharma" required>
                    </div>
                    <div class="input-group">
                        <label><i class="fas fa-envelope"></i> University email</label>
                        <input type="email" class="input-field" placeholder="priya@shobhituniversity.ac.in" value="priya.cse@shobhit.edu" required>
                    </div>
                    <div class="input-group">
                        <label><i class="fas fa-lock"></i> Password</label>
                        <input type="password" class="input-field" placeholder="Min. 8 characters" value="newpass123" required>
                    </div>
                    <div class="input-group">
                        <label><i class="fas fa-id-card"></i> Student ID (optional)</label>
                        <input type="text" class="input-field" placeholder="e.g. 2024CS101">
                    </div>

                    <!-- signup role: bike owner / rider -->
                    <div class="role-selector">
                        <label class="role-option">
                            <input type="radio" name="signupRole" value="owner" checked> <i class="fas fa-bicycle"></i> I have a two-wheeler
                        </label>
                        <label class="role-option">
                            <input type="radio" name="signupRole" value="rider"> <i class="fas fa-user-graduate"></i> I need rides
                        </label>
                    </div>

                    <button type="submit" class="btn-block btn-primary"><i class="fas fa-user-plus"></i> Create account (demo)</button>

                    <div class="footer-links">
                        Already have an account? <a href="#" id="switchToLoginFromSignup">Log in</a>
                    </div>
                    <div class="small-note">
                        <i class="fas fa-check-circle" style="color: #10b981;"></i> By signing up you agree to campus guidelines
                    </div>
                </form>
            </div>
        </div>
        <!-- additional note for demo -->
        <p style="text-align: center; margin-top: 24px; color: #475569; background: rgba(255,255,255,0.5); padding: 12px; border-radius: 60px; backdrop-filter: blur(4px);">
            <i class="fas fa-graduation-cap"></i> Choose bike owner or rider — both login/signup pages ready
        </p>
    </div>

    <!-- external javascript (script.js) -->
    <script>
        (function() {
            // ----- toggle between LOGIN page and SIGNUP page (simulating separate pages) -----
            const loginTab = document.getElementById('loginTabBtn');
            const signupTab = document.getElementById('signupTabBtn');
            const loginPanel = document.getElementById('loginPanel');
            const signupPanel = document.getElementById('signupPanel');

            // Switch to login page
            function showLoginPage() {
                loginPanel.classList.remove('hidden');
                signupPanel.classList.add('hidden');
                loginTab.classList.add('active');
                loginTab.classList.remove('inactive');
                signupTab.classList.remove('active');
                signupTab.classList.add('inactive');
                // update URL hash to reflect page (optional)
                window.location.hash = '#login';
            }

            // Switch to signup page
            function showSignupPage() {
                signupPanel.classList.remove('hidden');
                loginPanel.classList.add('hidden');
                signupTab.classList.add('active');
                signupTab.classList.remove('inactive');
                loginTab.classList.remove('active');
                loginTab.classList.add('inactive');
                window.location.hash = '#signup';
            }

            // Event listeners for tabs
            loginTab.addEventListener('click', (e) => {
                e.preventDefault();
                showLoginPage();
            });

            signupTab.addEventListener('click', (e) => {
                e.preventDefault();
                showSignupPage();
            });

            // "Create account" link inside login panel -> go to signup page
            document.getElementById('switchToSignupFromLogin').addEventListener('click', (e) => {
                e.preventDefault();
                showSignupPage();
            });

            // "Log in" link inside signup panel -> go to login page
            document.getElementById('switchToLoginFromSignup').addEventListener('click', (e) => {
                e.preventDefault();
                showLoginPage();
            });

            // Forgot password demo
            document.getElementById('forgotPasswordLink')?.addEventListener('click', (e) => {
                e.preventDefault();
                alert('📧 Password reset link would be sent to your university email (demo).');
            });

            // handle hash on load (direct deep link)
            if (window.location.hash === '#signup') {
                showSignupPage();
            } else {
                // default to login (already showing, but ensure)
                showLoginPage(); // ensures proper tab state
            }

            // optional: prevent form from actually submitting (already done via onsubmit)
        })();
    </script>
</body>
</html>
