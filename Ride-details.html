<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> request ride form</title>
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts: Outfit + Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f5ff;
            color: #0f1a2f;
            font-family: 'Plus Jakarta Sans', sans-serif;
            line-height: 1.5;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        a{
            text-decoration: none;
        }

        h1, h2, h3, h4 {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        /* main container: the request card */
        .request-card {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border-radius: 4rem;
            padding: 3rem 3.5rem;
            box-shadow: 0 45px 65px -20px rgba(31, 43, 150, 0.4);
            border: 2px solid rgba(242, 113, 158, 0.3);
            transition: all 0.2s;
        }

        /* header with biker info */
        .biker-summary {
            display: flex;
            align-items: center;
            gap: 2rem;
            padding-bottom: 2.2rem;
            border-bottom: 3px dashed #fad5e6;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }

        .biker-avatar {
            background: linear-gradient(145deg, #1F2B96, #F2719E);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 800;
            color: white;
            box-shadow: 0 15px 25px #F2719E80;
            border: 4px solid white;
        }

        .biker-details h3 {
            font-size: 2rem;
            background: linear-gradient(145deg, #1F2B96, #F2719E);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .biker-details p {
            font-size: 1rem;
            color: #2d3a5e;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .badge {
            background: #eae2ff;
            border-radius: 40px;
            padding: 0.5rem 1.5rem;
            font-weight: 600;
            font-size: 1.2rem;
            color: #1F2B96;
        }

        /* form title */
        .form-title {
            font-size: 1.8rem;
            margin-bottom: 2.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .form-title i {
            color: #F2719E;
            font-size: 2rem;
            font-weight: 600;
        }

        /* two column layout for location */
        .location-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.8rem;
            margin-bottom: 2.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .input-group label {
            font-weight: 700;
            font-size: 1.3rem;
            color: #1a2650;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-group label i {
            color: #F2719E;
            font-size: 1.5rem;
        }

        .input-field {
            background: #f9f4ff;
            border: 2px solid #fad5e6;
            border-radius: 3rem;
            padding: 1.4rem 2rem;
            font-size: 1rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: 0.2s;
            width: 100%;
        }

        .input-field:focus {
            outline: none;
            border-color: #F2719E;
            box-shadow: 0 0 0 5px rgba(242,113,158,0.2);
            background: white;
        }

        /* Payment section */
        .payment-section {
            background: #f1edff;
            border-radius: 3rem;
            padding: 2rem 2.2rem;
            margin: 2.8rem 0;
            border: 2px solid white;
        }

        .payment-title {
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .payment-options {
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
        }

        .payment-method {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background: white;
            padding: 1.2rem 2rem;
            border-radius: 4rem;
            border: 2px solid transparent;
            transition: 0.2s;
            cursor: pointer;
        }

        .payment-method:hover {
            border-color: #F2719E;
            background: #fffaff;
            transform: translateX(6px);
        }

        .payment-method input[type="radio"] {
            width: 24px;
            height: 24px;
            accent-color: #F2719E;
        }

        .payment-method label {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            width: 100%;
            cursor: pointer;
        }

        .method-icon {
            background: #eae2ff;
            width: 48px;
            height: 48px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #1F2B96;
        }

        .fare-breakdown {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 2px dashed #c9b6ff;
            font-size: 1.3rem;
        }

        .total-fare {
            background: linear-gradient(145deg, #1F2B96, #F2719E);
            color: white;
            padding: 0.8rem 2.2rem;
            border-radius: 4rem;
            font-weight: 800;
            font-size: 1.8rem;
        }

        /* action buttons */
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 1.8rem;
            margin-top: 2rem;
            align-items: center;
        }

        .btn-primary {
            background: linear-gradient(145deg, #1F2B96, #F2719E);
            border: none;
            color: white;
            font-weight: 700;
            font-size: 1.2rem;
            padding: 1.5rem 3.5rem;
            border-radius: 5rem;
            cursor: pointer;
            box-shadow: 0 15px 25px -5px #F2719E;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 1.2rem;
            border: 2px solid transparent;
        }

        .btn-primary:hover {
            transform: scale(1.02) translateY(-3px);
            box-shadow: 0 20px 30px -3px #F2719E;
            border-color: white;
        }

        .btn-secondary {
            background: transparent;
            border: 3px solid #1F2B96;
            color: #1F2B96;
            font-weight: 700;
            font-size: 1.6rem;
            padding: 1.3rem 3rem;
            border-radius: 5rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-secondary:hover {
            background: #1F2B96;
            color: white;
        }

        /* extra note */
        .secure-note {
            margin-top: 2rem;
            color: #4f5d84;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        /* responsive */
        @media (max-width: 600px) {
            .request-card {
                padding: 2rem 1.8rem;
            }
            .location-row {
                grid-template-columns: 1fr;
                gap: 1.2rem;
            }
            .biker-summary {
                flex-direction: column;
                align-items: flex-start;
            }
            .action-buttons {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-primary, .btn-secondary {
                justify-content: center;
            }
            .payment-method label {
                font-size: 1.3rem;
            }
        }

        /* simple map preview simulation (extra touch) */
        .map-preview {
            background: #d6e0ff;
            border-radius: 2.5rem;
            height: 120px;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at 20px 20px, #ffffff60 2px, transparent 2px), 
                              linear-gradient(145deg, #a0b4ff, #c5b4ff);
            background-size: 30px 30px, 100%;
            border: 3px solid white;
            color: #0f1a2f;
            font-weight: 600;
            font-size: 1.3rem;
            gap: 0.5rem;
        }
    </style>
</head>
<body>

<!-- REQUEST FORM DIV (responsive, with location & payment) -->
<div class="request-card">
    <!-- biker info (simulated for context) -->
    <div class="biker-summary">
        <div class="biker-avatar"><i class="fas fa-user-graduate"></i></div>
        <div class="biker-details">
            <h3>Anjali Sharma</h3>
            <p><span><i class="fas fa-star" style="color: gold;"></i> 4.98 (124 rides)</span> <span class="badge"><i class="fas fa-id-card"></i> verified</span></p>
            <p><i class="fas fa-motorcycle"></i> Scooty · HN23 · from Saharanpur</p>
        </div>
    </div>

    <!-- mini map preview (just for fun, indicates location pick) -->
    <a href="">
        <div class="map-preview">
        <i class="fas fa-location-dot" style="color:#F2719E;"></i> pick your pickup point on map
    </div></a>

    <!-- form title -->
    <div class="form-title">
        <i class="fas fa-pen-to-square"></i> <span>request this ride</span>
    </div>

    <!-- LOCATION OF STUDENT (pickup & dropoff) -->
    <div class="location-row">
        <div class="input-group">
            <label><i class="fas fa-circle-check" style="color:#1F2B96;"></i> your pickup</label>
            <input class="input-field" type="text" placeholder="e.g. Saharanpur bus stand" value="Saharanpur bus stand">
        </div>
        <div class="input-group">
            <label><i class="fas fa-flag-checkered" style="color:#F2719E;"></i> drop-off</label>
            <input class="input-field" type="text" placeholder="Usually university" value="Shobhit University Gangoh">
        </div>
    </div>

    <!-- additional location detail (optional but shows student exact location) -->
    <div style="margin-bottom: 2rem;">
        <div class="input-group">
            <label><i class="fas fa-location-crosshairs"></i> share live location (optional)</label>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <input class="input-field" type="text" placeholder="Or enter nearest landmark" value="Near Hanuman chowk">
                <button style="background: #F2719E20; border: 2px solid #F2719E; border-radius: 3rem; padding: 1.3rem 2rem; font-size: 1.3rem; font-weight:600; color:#1F2B96; white-space:nowrap;"><i class="fas fa-crosshairs"></i> auto</button>
            </div>
        </div>
    </div>

    <!-- PAYMENT SYSTEM SECTION -->
    <div class="payment-section">
        <div class="payment-title">
            <i class="fas fa-indian-rupee-sign" style="background: #1F2B96; color:white; border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center;"></i>
            <span>select payment method</span>
        </div>

        <div class="payment-options">
            <!-- upi option -->
            <div class="payment-method">
                <input type="radio" id="upi" name="payment" value="upi" checked>
                <label for="upi">
                    <span class="method-icon"><i class="fab fa-google-pay"></i></span>
                    <span>UPI / Google Pay / PhonePe</span>
                </label>
            </div>
            <!-- card option -->
            <div class="payment-method">
                <input type="radio" id="card" name="payment" value="card">
                <label for="card">
                    <span class="method-icon"><i class="fas fa-credit-card"></i></span>
                    <span>Credit / Debit Card</span>
                </label>
            </div>
            <!-- cash option -->
            <div class="payment-method">
                <input type="radio" id="cash" name="payment" value="cash">
                <label for="cash">
                    <span class="method-icon"><i class="fas fa-money-bill-wave"></i></span>
                    <span>Cash to biker ( ₹25 exact )</span>
                </label>
            </div>
        </div>

        <!-- fare breakdown (based on distance) -->
        <div class="fare-breakdown">
            <span><i class="fas fa-road"></i> distance 8.5 km · ₹25 base</span>
            <span class="total-fare">₹25</span>
        </div>
    </div>

    <!-- action buttons: confirm request (with payment simulation) -->
    <div class="action-buttons">
        <button class="btn-primary"><i class="fas fa-check-circle"></i> confirm & pay</button>
        <button class="btn-secondary"><i class="fas fa-arrow-left"></i> cancel</button>
    </div>

    <!-- extra secure note -->
    <div class="secure-note">
        <i class="fas fa-lock" style="color: #F2719E;"></i> your payment info is encrypted · campus verified
    </div>

    <!-- small demo hint (interactive) -->
    <p style="margin-top: 1.8rem; font-size: 1.2rem; color:#52658f;"><i class="fas fa-info-circle"></i> clicking "confirm & pay" will simulate a request</p>
</div>

<!-- tiny script to show demo interaction (payment selection and confirm) -->
<script>
    (function() {
        const confirmBtn = document.querySelector('.btn-primary');
        const paymentRadios = document.querySelectorAll('input[name="payment"]');
        const totalFareSpan = document.querySelector('.total-fare');

        // update total based on selection (just demo, but keep ₹25)
        paymentRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'cash') {
                    totalFareSpan.innerText = '₹25 (cash)';
                } else {
                    totalFareSpan.innerText = '₹25';
                }
            });
        });

        // confirm action
        confirmBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const selected = document.querySelector('input[name="payment"]:checked');
            const method = selected ? selected.value : 'upi';
            alert(`✅ request sent to Anjali! payment method: ${method}. you'll be notified when she accepts.`);
        });
    })();
</script>

</body>
</html>
